global:
  scrape_interval: 15s   # How often Prometheus scrapes metrics

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Scrape Node Exporter on remote server (3.216.91.81)
  - job_name: 'server_1'
    static_configs:
      - targets: ['<server_1_ip>:9100']

  - job_name: 'server_2'
    static_configs:
      - targets: ['44.223.108.108:9100']
