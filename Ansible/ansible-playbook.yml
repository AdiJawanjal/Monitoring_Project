---
- name: Configure monitoring target node for Prometheus
  hosts: target_nodes
  become: yes
  vars:
    node_exporter_version: "1.8.2"
    node_exporter_user: "node_exporter"
    node_exporter_bin_path: "/usr/local/bin/node_exporter"
    node_exporter_service_path: "/etc/systemd/system/node_exporter.service"
    node_exporter_port: 9100

  tasks:
    - name: Create node_exporter user
      user:
        name: "{{ node_exporter_user }}"
        shell: /usr/sbin/nologin
        system: yes
        create_home: no

    - name: Download Node Exporter
      get_url:
        url: "https://github.com/prometheus/node_exporter/releases/download/v{{ node_exporter_version }}/node_exporter-{{ node_exporter_version }}.linux-amd64.tar.gz"
        dest: "/tmp/node_exporter.tar.gz"
        mode: '0644'

    - name: Extract Node Exporter directly to /usr/local/bin
      unarchive:
        src: "/tmp/node_exporter.tar.gz"
        dest: "/usr/local/bin/"
        remote_src: yes
        extra_opts: [--strip-components=1]


    - name: Clean up Node Exporter archive and temp folder
      file:
        path: "/tmp/node_exporter-{{ node_exporter_version }}.linux-amd64"
        state: absent

    - name: Remove archive file
      file:
        path: "/tmp/node_exporter.tar.gz"
        state: absent

    - name: Create systemd service file for Node Exporter
      copy:
        dest: "{{ node_exporter_service_path }}"
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Prometheus Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User={{ node_exporter_user }}
          Group={{ node_exporter_user }}
          Type=simple
          ExecStart={{ node_exporter_bin_path }}
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target

    - name: Reload systemd daemon
      command: systemctl daemon-reload

    - name: Enable and start Node Exporter service
      systemd:
        name: node_exporter
        enabled: yes
        state: started

    - name: Open firewall port for Node Exporter (if using ufw)
      ufw:
        rule: allow
        port: "{{ node_exporter_port }}"
        proto: tcp
      when: ansible_facts['os_family'] == "Debian"
      ignore_errors: yes

    - name: Open firewall port for Node Exporter (if using firewalld)
      firewalld:
        port: "{{ node_exporter_port }}/tcp"
        permanent: true
        state: enabled
        immediate: yes
      when: ansible_facts['os_family'] == "RedHat"
      ignore_errors: yes
