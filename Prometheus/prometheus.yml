global:
  scrape_interval: 15s   # How often Prometheus scrapes metrics

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"

scrape_configs:
  # Scrape Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node_1'
    static_configs:
      - targets: ['3.238.3.187:9100']

  - job_name: 'node_2'
    static_configs:
      - targets: ['3.227.12.113:9100']

  - job_name: 'node_3'
    static_configs:
      - targets: ['13.219.244.253:9100']

  - job_name: 'node_4'
    static_configs:
      - targets: ['34.205.53.196:9100']

  - job_name: 'node_5'
    static_configs:
      - targets: ['34.201.11.37:9100']

  - job_name: 'node_6'
    static_configs:
      - targets: ['3.238.34.6:9100']

  - job_name: 'node_7'
    static_configs:
      - targets: ['3.239.108.235:9100']

  - job_name: 'node_8'
    static_configs:
      - targets: ['13.222.124.34:9100']

  - job_name: 'node_9'
    static_configs:
      - targets: ['44.192.131.243:9100']

  - job_name: 'node_10'
    static_configs:
      - targets: ['13.222.106.225:9100']

rule_files:
  - "alert-rules.yml"
